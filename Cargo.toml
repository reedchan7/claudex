[package]
name = "claudex"
version = "0.7.2"
edition = "2024"
description = "A CLI that extends the Claude Code CLI with extra commands, starting with `claudex usage` for plan usage limits."
license = "MIT"
repository = "https://github.com/reedchan7/claudex"
homepage = "https://github.com/reedchan7/claudex"
authors = ["Reed Chan <xinyuchen77@gmail.com>"]
keywords = ["claude", "cli", "usage", "anthropic"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "claudex"
path = "src/main.rs"

[features]
# `bar` adds the desktop widget (`claudex widget …`, egui floating window +
# tray icon). CLI-only builds stay free of GUI dependencies.
bar = [
    "dep:eframe",
    "dep:tray-icon",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:libc",
    "dep:signal-hook",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
colored = "3.1.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
iana-time-zone = "0.1.65"
terminal_size = "0.4.4"
self-replace = "1.5.0"
sha2 = "0.11.0"
libc = { version = "0.2.189", optional = true }
signal-hook = { version = "0.4.4", optional = true }
eframe = { version = "0.36.1", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }
tray-icon = { version = "0.24.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
